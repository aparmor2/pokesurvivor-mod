# Al subir una etiqueta vX.Y.Z: comprueba que coincide con manifest.json,
# crea el zip de la extensión y publica la Release con ese zip.
# Notas: intro.md + instalar.md + autor.md + novedades (.github/notes/vX.Y.Z.md si existe) + funciones.md + english.md.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Comprobar versión
        run: |
          tag="${GITHUB_REF_NAME#v}"
          manifest="$(jq -r .version manifest.json)"
          if [ "$tag" != "$manifest" ]; then
            echo "::error::La etiqueta es $GITHUB_REF_NAME pero manifest.json dice $manifest"
            exit 1
          fi

      - name: Crear zip
        run: zip "pokesurvivor-mod-$GITHUB_REF_NAME.zip" manifest.json background.js inject.js keepalive.js sounds/shiny.ogg README.md LICENSE

      - name: Publicar Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          zip="pokesurvivor-mod-$GITHUB_REF_NAME.zip"
          {
            cat .github/notes/intro.md
            echo
            cat .github/notes/instalar.md
            echo
            cat .github/notes/autor.md
            echo
            if [ -f ".github/notes/$GITHUB_REF_NAME.md" ]; then cat ".github/notes/$GITHUB_REF_NAME.md"; echo; fi
            cat .github/notes/funciones.md
            echo
            cat .github/notes/english.md
          } > notes.md
          gh release create "$GITHUB_REF_NAME" "$zip" --title "PokéSurvivor Mod ${GITHUB_REF_NAME#v}" --notes-file notes.md
